name: Update PS4 Storage Database

on:
  schedule:
    - cron: '0 0 * * 0'  # Runs automatically every Sunday at midnight UTC
  workflow_dispatch:      # Allows you to click 'Run workflow' manually anytime

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Gives the Action permission to push commits to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add games.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update PS4 storage sizes" && git push)
