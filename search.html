<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PS4 Database - Search & Store</title>
  <meta name="description" content="Search PS4 PKG database by title, region, and genres.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/themes.css">
</head>
<body>
  <div class="orbs-bg"></div>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <span class="sidebar__logo">NoPayStation™</span>
      </div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__nav-item" data-nav="smooth">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
          Home
        </a>
        <a href="search.html" class="sidebar__nav-item active" data-nav="smooth">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          Search / Store
        </a>
        <a href="wishlist.html" class="sidebar__nav-item" data-nav="smooth">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
          Wishlist <span class="sidebar-badge" id="sidebarWishlistBadge" style="display:none;">0</span>
        </a>
        <a href="javascript:void(0)" class="sidebar__nav-item" id="sidebarProfileLink">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
          Profile & Avatars
        </a>
        <a href="javascript:void(0)" class="sidebar__nav-item" id="sidebarSettingsLink">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="sidebar__user" id="userProfileBtn" title="Click to change username & avatar">
          <div class="sidebar__avatar" id="userAvatarContainer">
            <img id="userAvatarImg" src="" alt="Avatar" style="display:none;" />
            <span id="userAvatarInitial">D</span>
          </div>
          <div class="sidebar__user-info" style="overflow:hidden;">
            <div id="sidebarUsername" class="sidebar__user-name">dimze</div>
            <div class="sidebar__user-edit-hint">Change Avatar ✎</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <nav class="top-header__nav">
          <a href="index.html" class="top-header__nav-link" data-nav="smooth">HOME</a>
          <a href="search.html" class="top-header__nav-link active" data-nav="smooth">STORE</a>
          <a href="wishlist.html" class="top-header__nav-link" data-nav="smooth">
            WISHLIST <span class="nav-badge" id="headerWishlistBadge" style="display:none;">0</span>
          </a>
        </nav>
        <div class="top-header__actions">
          <button id="profileOpenBtn" class="header-user-btn" title="Choose Profile & Avatar">
            <span id="headerAvatarPreview" class="header-avatar-preview">D</span>
            <span id="headerUsername">dimze</span>
          </button>
          <select id="themeSelect" class="theme-select" aria-label="Select theme"></select>
          <button id="themeToggle" class="btn--icon" style="font-size:1.2rem; width:38px; height:38px;" title="Cycle Theme" aria-label="Cycle theme">🌙</button>
          <button id="headerSettingsBtn" class="btn--icon" style="font-size:1.2rem; width:38px; height:38px;" title="Website Settings" aria-label="Website settings">⚙️</button>
        </div>
      </header>

      <div class="content-area" style="display: flex; gap: var(--space-xl); align-items: flex-start;">
        <!-- Filter Sidebar (Firmware removed) -->
        <aside style="width: 250px; flex-shrink: 0;" class="reveal reveal--slide-left">
          <div class="filter-group">
            <h4 class="filter-group__title">Region</h4>
            <label class="filter-option">
              <input type="checkbox" name="region" value="USA">
              <span>USA</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" name="region" value="EUR">
              <span>Europe (EUR)</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" name="region" value="JAP">
              <span>Japan (JAP)</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" name="region" value="ASIA">
              <span>Asia</span>
            </label>
          </div>

          <button class="btn btn--secondary btn--full" id="resetFilters">
            Reset Filters
          </button>
        </aside>

        <!-- Results Area -->
        <div style="flex: 1; min-width: 0;">
          <div class="reveal reveal--fade" style="display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); flex-wrap: wrap;">
            <input type="text" id="searchInput" placeholder="Search games by title, ID, developer..." style="flex: 1; min-width: 240px; padding: 12px 18px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text-primary); font-size: 1rem; box-shadow: var(--shadow-card);">
            <select id="sortSelect" style="padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text-primary); font-weight: 600;" aria-label="Sort games">
              <option value="title">Sort by Title (A-Z)</option>
              <option value="releaseDate">Sort by Release Date</option>
              <option value="size.game">Sort by Size</option>
            </select>
          </div>

          <!-- Result count + Page size (12, 24, 48) -->
          <div class="reveal reveal--fade" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md);">
            <span id="resultCount" style="color: var(--color-text-secondary); font-size: 0.9rem; font-weight: 500;"></span>
            <div style="display: flex; align-items: center; gap: var(--space-sm);">
              <label style="font-size: 0.875rem; color: var(--color-text-secondary);">Per page:</label>
              <select id="pageSize" style="padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-bg-card); color: var(--color-text-primary); font-weight: 600;">
                <option value="12">12</option>
                <option value="24" selected>24</option>
                <option value="48">48</option>
              </select>
            </div>
          </div>

          <!-- Game Grid -->
          <div class="game-grid" id="gameGrid"></div>

          <!-- Single Pagination Container -->
          <div id="pagination" class="pagination"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Game Details Modal -->
  <div class="modal" id="gameModal">
    <div class="modal__content">
      <div class="modal__header">
        <h2 class="modal__title">Game Details</h2>
        <button class="modal__close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal__body"></div>
    </div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
